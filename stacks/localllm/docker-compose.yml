services:

  ollama:
    container_name: ollama
    image: ollama/ollama
    ports:
      - 11434:11434
    volumes:
      - ollama:/root/.ollama
    entrypoint: >
      sh -c "
      ollama serve &
      sleep 3 &&
      ollama pull qwen2.5:1.5b &&
      wait
      "
    networks:
      - local_ai_network
    restart: unless-stopped

volumes:
  ollama: {}

networks:
  local_ai_network:
    external: true
    name: local_ai_network
